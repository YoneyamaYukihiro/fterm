name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.2.3)'
        required: true

jobs:
  publish:
    name: publish-${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-13
            rid: osx-x64
          - os: macos-14
            rid: osx-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="${{ github.event.inputs.version }}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Publish (single-file self-contained)
        shell: bash
        run: |
          dotnet publish src/Fterm.App/Fterm.App.csproj \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:Version=${{ steps.ver.outputs.version }} \
            -p:InformationalVersion=${{ steps.ver.outputs.version }} \
            -o artifacts/${{ matrix.rid }}

      - name: Archive
        shell: bash
        run: |
          cd artifacts/${{ matrix.rid }}
          if [[ "${{ matrix.rid }}" == win-* ]]; then
            7z a -tzip "../../fterm-${{ steps.ver.outputs.version }}-${{ matrix.rid }}.zip" .
          else
            tar -czf "../../fterm-${{ steps.ver.outputs.version }}-${{ matrix.rid }}.tar.gz" .
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fterm-${{ matrix.rid }}
          path: fterm-${{ steps.ver.outputs.version }}-${{ matrix.rid }}.*

  release:
    name: GitHub Release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Generate manifest.json
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          declare -A M
          for f in dist/*/fterm-*-*.{tar.gz,zip}; do
            [[ -f "$f" ]] || continue
            B=$(basename "$f")
            RID=$(echo "$B" | sed -E "s/fterm-${V}-(.+)\.(tar\.gz|zip)/\1/")
            SHA=$(sha256sum "$f" | awk '{print $1}')
            SIZE=$(stat -c '%s' "$f")
            URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${V}/${B}"
            M["$RID"]="\"$RID\":{\"url\":\"$URL\",\"sha256\":\"$SHA\",\"size\":$SIZE}"
          done
          {
            echo "{"
            echo "  \"version\": \"$V\","
            echo "  \"notes\": \"fterm $V\","
            echo "  \"assets\": {"
            FIRST=1
            for RID in "${!M[@]}"; do
              if [[ $FIRST -eq 1 ]]; then FIRST=0; else echo ","; fi
              echo -n "    ${M[$RID]}"
            done
            echo ""
            echo "  }"
            echo "}"
          } > dist/manifest.json
          cat dist/manifest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/fterm-*.tar.gz
            dist/**/fterm-*.zip
            dist/manifest.json
          body: |
            Pre-built single-file self-contained binaries for fterm.

            **Code signing**: these artifacts are *not* signed.
            See `docs/RELEASE.md` for signing instructions before publishing publicly.
